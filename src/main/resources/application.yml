spring:
  application:
    name: votacao

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

logging:
  level:
    root: INFO
    com.br.votacao: INFO
    org.hibernate.SQL: DEBUG

# Client fake de CPF: ativo em dev, configurável em prod
app:
  cpf-client:
    fake:
      enabled: true

---
spring:
  config:
    activate-on-profile: dev

  datasource:
    url: jdbc:h2:mem:votacao;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

logging:
  level:
    com.br.votacao: DEBUG

---
spring:
  config:
    activate-on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:votacao}
    username: ${DB_USERNAME:votacao}
    password: ${DB_PASSWORD:votacao}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

logging:
  level:
    com.br.votacao: INFO
    org.hibernate.SQL: WARN
